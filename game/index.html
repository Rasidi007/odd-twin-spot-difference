<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odd Twin — Spot the Difference</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1526; }
  #game {
    position: fixed; inset: 0; margin: auto; display: block;
    width: min(100vw, 160vh); height: min(100vh, 62.5vw);
    touch-action: none; cursor: default;
  }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Odd Twin: a spot the difference game. Two near-identical pictures sit side by side; click the differences to find them all before time runs out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
